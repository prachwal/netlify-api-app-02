[build]
  # Directory to change to before starting a build (relative to the root of your repository)
  base = "."

  # Directory that contains the deploy-ready HTML files and assets generated by the build (relative to the base directory)
  publish = "dist"

  # Default build command
  command = "npm run build"

[build.environment]
  # Node.js version to use (optional, defaults to latest LTS)
  NODE_VERSION = "18"

# Build settings
[build.settings]
  # Only build on commits to main/master branch (optional)
  # Uncomment to limit builds to specific branches
  # Allow only branch deploy on: main, develop, staging

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (add any needed for your app)
[context.production.environment]
  # Add production-specific environment variables here if needed

# Branch-specific configurations (optional)
[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

[context.branch-deploy]
  command = "npm run build"
  publish = "dist"
